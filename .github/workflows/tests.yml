name: Automation tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check shell entry point
        run: bash -n verify.sh
      - name: Run downloader, bootstrap and runner tests
        run: python3 -m unittest discover -s tests -v
